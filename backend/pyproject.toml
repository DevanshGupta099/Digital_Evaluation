[project]
name = "ai-answer-script-grader"
version = "0.1.0"
description = "AI-assisted handwritten answer script grading: OCR, rubric evaluation, PDF annotation, human review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMuPDF>=1.24",
    "sqlalchemy>=2.0",
    "google-generativeai>=0.8",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
azure = ["azure-ai-documentintelligence>=1.0.0b3"]
google = ["google-cloud-vision>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
